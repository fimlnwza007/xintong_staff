<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบนับ Stock สินค้า</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .quantity-input {
            width: 90px;
            padding: 0;
            text-align: center;
        }

        .quantity-input::-webkit-inner-spin-button,
        .quantity-input::-webkit-outer-spin-button {
            margin: 0;
            -webkit-appearance: none;
        }

        .quantity-input {
            -moz-appearance: textfield;
        }

        .product-table {
            width: 100%;
            table-layout: fixed;
        }

        .product-table th,
        .product-table td {
            overflow-wrap: anywhere;
        }

        @media (max-width: 576px) {
            .product-table {
                font-size: 0.75rem;
            }

            .product-table th,
            .product-table td {
                padding: 0.5rem 0.25rem;
            }

            .product-table th:nth-child(1) {
                width: 19%;
            }

            .product-table th:nth-child(2) {
                width: 23%;
            }

            .product-table th:nth-child(3) {
                width: 23%;
            }

            .product-table th:nth-child(4) {
                width: 20%;
            }

            .product-table th:nth-child(5) {
                width: 15%;
            }

            .quantity-input {
                width: 48px;
            }

            .quantity-actions {
                gap: 0.3rem !important;
                justify-content: center;
            }

            .quantity-actions .btn {
                width: 28px;
                padding: 0.25rem 0;
            }

            .product-table .btn-danger {
                padding: 0.25rem 0.55rem;
            }
        }
    </style>
</head>
<body class="bg-light">

<div class="container py-4">
    <h2 class="mb-4 text-center fw-bold text-primary">Xintong Stocking</h2>

    <!-- ส่วนที่ 1: ฟอร์มค้นหา & ฟอร์มเพิ่มสินค้า -->
    <div class="row g-3 mb-4">
        <!-- ฟอร์มค้นหา -->
        <div class="col-md-6">
            <div class="card shadow-sm p-3">
                <form th:action="@{/products}" method="get" class="d-flex gap-2">
                    <input type="text" name="keyword" class="form-control" 
                           placeholder="ค้นหาชื่อหรือรหัสสินค้า..." th:value="${keyword}">
                    <button type="submit" class="btn btn-primary">ค้นหา</button>
                    <a th:href="@{/products}" class="btn btn-outline-secondary">ล้าง</a>
                </form>
            </div>
        </div>

        <!-- ฟอร์มเพิ่มสินค้าใหม่ -->
        <div class="col-md-6">
            <div class="card shadow-sm p-3">
                <form th:action="@{/products/add}" th:object="${newProduct}" method="post" class="row g-2">
                    <div class="col-4">
                        <input type="text" th:field="*{code}" class="form-control" placeholder="รหัสสินค้า (เว้นว่างเพื่อสร้างเลขรัน)">
                    </div>
                    <div class="col-5">
                        <input type="text" th:field="*{name}" class="form-control" placeholder="ชื่อสินค้า" required>
                    </div>
                    <div class="col-2">
                        <input type="number" th:field="*{piecesPerBox}" class="form-control" min="1" placeholder="ชิ้น/กล่อง" required>
                    </div>
                    <div class="col-1">
                        <button type="submit" class="btn btn-success w-100">+ เพิ่ม</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- ส่วนที่ 2: ตารางรายการสินค้า -->
    <div class="card shadow-sm">
        <div class="card-header bg-white d-flex justify-content-end align-items-center gap-2">
            <span class="text-muted">เรียงตาม</span>
            <div class="btn-group btn-group-sm" role="group" aria-label="เรียงรายการสินค้า">
                <a th:href="@{/products(keyword=${keyword}, sort='id')}"
                   class="btn"
                   th:classappend="${sort == 'id'} ? 'btn-primary' : 'btn-outline-primary'">ID</a>
                <a th:href="@{/products(keyword=${keyword}, sort='name')}"
                   class="btn"
                   th:classappend="${sort == 'name'} ? 'btn-primary' : 'btn-outline-primary'">ชื่อ</a>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0 text-center product-table">
                    <thead class="table-dark">
                        <tr class = " pd-10">
                            <th>รหัสสินค้า</th>
                            <th>ชื่อสินค้า</th>
                            <th>จำนวนคงเหลือ</th>
                            <th>+/-</th>
                            <th>จัดการ</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="product : ${products}">
                            <td class="fw-bold" th:text="${product.code}">PROD001</td>
                            <td class="text-start" th:text="${product.name}">สินค้าตัวอย่าง</td>
                            <td>
                                <span th:if="${product.piecesPerBox > 1}">
                                    <span th:text="${product.boxCount}">0</span> กล่อง
                                    <span th:if="${product.loosePieces > 0}">
                                        <span th:text="${product.loosePieces}">0</span> ชิ้น
                                    </span>
                                </span>
                                <span th:unless="${product.piecesPerBox > 1}">
                                    <span th:text="${product.quantity}">0</span> ชิ้น
                                </span>
                            </td>
                            <td>
                                <div class="d-inline-flex gap-1 quantity-actions">
                                    <!-- ปุ่มเพิ่ม (+1) -->
                                    <form th:action="@{/products/{id}/increase(id=${product.id})}" method="post">
                                        <button type="submit" class="btn btn-outline-success btn-sm px-3 fw-bold">+</button>
                                    </form>
                                    <!-- ปุ่มลด (-1) -->
                                    <form th:action="@{/products/{id}/decrease(id=${product.id})}" method="post">
                                        <button type="submit" class="btn btn-outline-danger btn-sm px-3 fw-bold">-</button>
                                    </form>

                                </div>
                            </td>
                            <td>
                                <a th:href="@{/products/{id}/edit(id=${product.id})}"
                                   class="btn btn-warning btn-sm">แก้ไข</a>
                                <!-- ปุ่มลบรายการ -->
                                <form th:action="@{/products/{id}/delete(id=${product.id})}" method="post" 
                                      onsubmit="return confirm('ยืนยันที่จะลบสินค้านี้ใช่หรือไม่?');">
                                    <button type="submit" class="btn btn-danger btn-sm">ลบ</button>
                                </form>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(products)}">
                            <td colspan="5" class="text-muted py-4">ไม่พบรายการสินค้าในระบบ</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

</body>
</html>
