<!DOCTYPE html>
<html lang="th" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แก้ไขสินค้า</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="card shadow-sm mx-auto" style="max-width: 520px">
        <div class="card-header">
            <h2 class="h5 mb-0">แก้ไขสินค้า</h2>
        </div>
        <div class="card-body">
            <form th:action="@{/products/{id}/edit(id=${product.id})}" th:object="${product}" method="post">
                <div class="mb-3">
                    <label for="code" class="form-label">รหัสสินค้า</label>
                    <input id="code" type="text" th:field="*{code}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label for="name" class="form-label">ชื่อสินค้า</label>
                    <input id="name" type="text" th:field="*{name}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">จำนวนคงเหลือ</label>
                    <div class="row g-2">
                        <div class="col-4">
                            <input type="number" name="boxes" th:value="${product.boxCount}" min="0" step="1" class="form-control" th:placeholder="${product.packageUnit}" required>
                            <small class="text-muted" th:text="${product.packageUnit}">กล่อง</small>
                        </div>
                        <div class="col-4">
                            <input type="number" name="pieces" th:value="${product.loosePieces}" min="0" step="1" class="form-control" th:placeholder="${product.pieceUnit}" required>
                            <small class="text-muted" th:text="${product.pieceUnit}">ชิ้น</small>
                        </div>
                        <div class="col-4">
                            <input type="number" name="piecesPerBox" th:value="${product.piecesPerBox}" min="1" step="1" class="form-control" required>
                            <small class="text-muted">
                                <span th:text="${product.pieceUnit}">ชิ้น</span>ต่อ<span th:text="${product.packageUnit}">กล่อง</span>
                            </small>
                        </div>
                    </div>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-6">
                        <label for="packageUnit" class="form-label">หน่วยใหญ่</label>
                        <input id="packageUnit" type="text" th:field="*{packageUnit}" class="form-control" placeholder="เช่น แพ็ค, ลัง" required>
                    </div>
                    <div class="col-6">
                        <label for="pieceUnit" class="form-label">หน่วยย่อย</label>
                        <input id="pieceUnit" type="text" th:field="*{pieceUnit}" class="form-control" placeholder="เช่น ขวด, กระป๋อง" required>
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">บันทึก</button>
                    <a th:href="@{/products}" class="btn btn-outline-secondary">ยกเลิก</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
